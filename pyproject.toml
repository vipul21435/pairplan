[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pairplan"
version = "0.1.0"
description = "Plan pairwise comparisons for ranking systems from human votes: which pairs to show next, how many votes are needed, and when the ranking is settled."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
keywords = [
    "pairwise comparison",
    "bradley-terry",
    "ranking",
    "active learning",
    "human evaluation",
    "experimental design",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "scipy>=1.10"]
plot = ["matplotlib>=3.7"]

[project.scripts]
pairplan = "pairplan.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/pairplan"

[tool.hatch.build.targets.wheel]
packages = ["src/pairplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pairplan"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
